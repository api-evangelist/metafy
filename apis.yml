name: Metafy
description: >-
  Metafy is a consumer marketplace for gaming coaching and mentorship,
  connecting players with expert coaches and professional gamers for
  personalized one-on-one lessons, VOD reviews, and guides across popular
  competitive titles. Metafy operates a consumer web platform at metafy.gg and,
  as of this enrichment pass, publishes no public developer API, developer
  portal, or API documentation; the only machine-discoverable surface found was
  an RFC 9116 /.well-known/security.txt security contact. Surfaced as a
  portfolio company of dcm-ventures.
